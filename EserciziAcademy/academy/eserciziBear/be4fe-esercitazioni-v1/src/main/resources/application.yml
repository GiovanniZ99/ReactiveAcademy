spring:
  profile: development
  application:
    name: "@project.artifactId@"
    version: "@project.version@ (@env.GIT_COMMIT@)"

error-manager:
  enabled: true

error-handling:
  #enable exception logging
  enableExceptionLogging: true
  #if error logging enabled this enable stacktrace logging
  enableStacktraceLogging: true
  #enable event raising on exception
  enableExceptionEvent: false
  #enable exception message decoding
  enableExceptionDecoding: true
  #if exception decoding is enabled this enable the tracking of unknown error message
  enableUnknowExceptionMapping: true
  #this in a tag for unknown error message log
  unknowExceptionTag: UNKNOWN_ERROR_CODE

session-manager:
  mocked: false
  allow-guest-session: false
  endpoint: your session manager endpoint

################################################################################################################
# TRACING NOTES

tracing:
  enabled: false
  mocked: false


#### Security configuration
keycloak:
  enabled: false
  auth-server-url:
  resource:
  realm:
  public-client: true
  ssl-required: external
  confidential-port: 0
  use-resource-role-mappings: false
  principal-attribute: preferred_username
  bearer-only: true
  autodetect-bearer-only: true
  token-store: cookie
  security-constraints:
    - auth-roles:
        - openid
      security-collections:
        - name: reserved
          patterns:
            - /*

KAFKA_TOPIC_DEMO: Country-Zaffinelli2
KAFKA_STRATEGIA_BROKERS: 10.207.236.68:29092
KAFKA_STRATEGIA_GROUPID: mpab0
KAFKA_STRATEGIA_SECURITY_PROTOCOL: PLAINTEXT
KEYTAB_KERB_FILE_PATH: /usr/local/security/SDH_MPAB0.keytab
KEYTAB_KERB_USERNAME: SDH_MPAB0
KEYTAB_KERB_REALM_DOMAIN: SYSSEDE.SYSTEST.SANPAOLOIMI.COM
listeners:
  eventConfigurations:
    items:
      DemoListeners:
        bootstrapServers: ${KAFKA_STRATEGIA_BROKERS}
        topic: ${KAFKA_TOPIC_DEMO}
        groupId: ${KAFKA_STRATEGIA_GROUPID}
        clientId: DEMO
        concurrency: 3
        enable.auto.commit: true
        max.poll.records: 10
        security:
          protocol: ${KAFKA_STRATEGIA_SECURITY_PROTOCOL}
          sasl:
            kerberos:
              service:
                name: ${KAFKA_STRATEGIA_SERVICE_NAME:xx}
              jaas:
                config: com.sun.security.auth.module.Krb5LoginModule required
                useKeyTab: true
                keyTab: ${KEYTAB_STRATEGIA_KERB_FILE_PATH}
                principal: ${KEYTAB_STRATEGIA_KERB_USERNAME}@${KEYTAB_STRATEGIA_KERB_REALM_DOMAIN}

connectors:
  bearInternalConfigurations:
    items:
      CountryRestConnector:
        url: http://localhost:8080/country
        enabledTracing: true
        timeout: 5000
        mocked: false
        method: POST
  eventConfigurations:
    items:
      CountryEventConnector:
        topic: ${KAFKA_TOPIC}
        bootstrapServers: ${KAFKA_STRATEGIA_BROKERS}
        security:
          protocol: ${KAFKA_STRATEGIA_SECURITY_PROTOCOL}
        sasl:
          kerberos:
            service:
              name: ${KAFKA_STRATEGIA_SERVICE_NAME:xx}
          jaas:
            config: "com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true keyTab=\"${KEYTAB_KERB_FILE_PATH}\" principal=\"${KEYTAB_KERB_USERNAME}@${KEYTAB_KERB_REALM_DOMAIN}\";"